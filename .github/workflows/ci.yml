name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The API seam runs against a real Postgres, not a mock.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: securesend
          POSTGRES_PASSWORD: securesend
          POSTGRES_DB: securesend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securesend -d securesend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://securesend:securesend@localhost:5432/securesend

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
