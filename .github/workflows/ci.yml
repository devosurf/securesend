name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The API seam runs against a real Postgres, not a mock.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: securesend
          POSTGRES_PASSWORD: securesend
          POSTGRES_DB: securesend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securesend -d securesend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://securesend:securesend@localhost:5432/securesend

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The crypto vectors run in Node and in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The claims audit reads what the build wrote, so it goes after it. What it
      # checks and why is in scripts/claims.
      - run: pnpm audit:claims

  # The container, built and then driven. It replaces a job that only built the
  # image, because an image that serves the three journeys and scores 95 has plainly
  # built too, and nothing here had ever asked the container for a page.
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the image, waits for its healthcheck, runs the journeys, the moves and
      # the score gate, and brings it down again. See playwright.config.ts.
      - run: pnpm smoke
