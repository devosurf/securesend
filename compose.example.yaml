name: securesend

# The whole product: one app container plus Postgres.
#
#   cp compose.example.yaml compose.yaml
#   docker compose up
#
# Then http://localhost:3000. Your compose.yaml is gitignored, so anything you put
# in it stays out of commits.
#
# The database password is one variable used in two places, so the two can never
# disagree. It defaults to something obvious, which is fine while only the app can
# reach the database: nothing below publishes a Postgres port. Before this instance
# matters to anybody, set a real one and recreate the volume:
#
#   echo "DB_PASSWORD=$(openssl rand -base64 24)" > .env
#   docker compose down -v && docker compose up
#
# Before you put this on a real hostname: the encryption happens in the browser
# through Web Crypto, which browsers only expose over HTTPS or on localhost. Put
# a proxy that terminates TLS in front of this, or the product cannot encrypt at
# all. See docs/self-hosting.md.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://securesend:${DB_PASSWORD:-change-me}@db:5432/securesend
      PORT: 3000
      # Everything else has a working default. .env.example is the reference for
      # what you can change: size caps, rate limits, and which header carries the
      # caller's address when a proxy in front of this puts it in one.
    ports:
      # Reachable from anywhere this host is. Behind a reverse proxy on the same
      # machine, "127.0.0.1:3000:3000" keeps it off the public interface instead.
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # No ports. Only the app talks to this, over the network compose makes for
    # them, so there is nothing to expose to the host.
    environment:
      POSTGRES_USER: securesend
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: securesend
    volumes:
      # Postgres 18 keeps its data in a version subdirectory of this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesend -d securesend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
